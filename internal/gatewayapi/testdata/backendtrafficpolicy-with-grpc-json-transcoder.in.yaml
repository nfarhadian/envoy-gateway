gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      namespace: envoy-gateway
      name: gateway-1
    spec:
      gatewayClassName: envoy-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      namespace: default
      name: httproute-1
    spec:
      hostnames:
        - gateway.envoyproxy.io
      parentRefs:
        - namespace: envoy-gateway
          name: gateway-1
          sectionName: http
      rules:
        - matches:
            - path:
                value: "/"
          backendRefs:
            - name: service-1
              port: 8080
configMaps:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      namespace: default
      name: proto-descriptor
    binaryData:
      proto-descriptor: CnkKCmVjaG8ucHJvdG8SB3Rlc3QudjEiDQoLUGluZ1JlcXVlc3QiDgoMUGluZ1Jlc3BvbnNlMjsKBEVjaG8SMwoEUGluZxIULnRlc3QudjEuUGluZ1JlcXVlc3QaFS50ZXN0LnYxLlBpbmdSZXNwb25zZWIGcHJvdG8z
backendTrafficPolicies:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      namespace: default
      name: policy-for-route
      generation: 10
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: httproute-1
      grpcJsonTranscoder:
        services:
          - test.v1.Echo
        protoDescriptor:
          valueRef:
            group: ""
            kind: ConfigMap
            name: proto-descriptor
        convertGrpcStatus: true
        ignoreUnknownQueryParameters: true
        printOptions:
          addWhitespace: true
          alwaysPrintPrimitiveFields: true
